[project]
name = "npb-rpc"
version = "0.1.0"
description = "Typed RPC for Pydantic and NumPy payloads using the NPB codec"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NPB contributors" },
]
keywords = [
    "ipc",
    "nng",
    "rpc",
    "numpy",
    "pydantic",
    "zeromq",
    "zero-copy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",

    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "dai>=0.3.75",
    "depthai_camera_stream@git+https://github.com/qinhy/depthai-camera-stream",
    "npb@git+https://github.com/qinhy/npb",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
iceoryx2 = [
    "iceoryx2>=0.9.3,<0.10",
]
nng = [
    "pynng>=0.9,<1",
]
zmq = [
    "pyzmq>=27.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "opencv-python>=5.0.0.93",
    "pynng>=0.9,<1",
    "pytest>=8",
    "pyzmq>=27.0",
    "iceoryx2>=0.9.3,<0.10",
    "ruff>=0.8",
    "ultralytics>=8.4.150",
    "uvicorn>=0.52.4",
    # Linux / Windows -> CUDA build
    # macOS -> native Apple Silicon build with MPS
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "ipython>=9.17.1",
    "timm>=1.0.29",
    "imageio>=2.37.4",
    "omegaconf>=2.3.1",
    # torch.compile / Triton
    # Triton is not installed on macOS.
    "triton>=3.8,<3.9; sys_platform == 'linux'",
    "triton-windows>=3.8,<3.9; sys_platform == 'win32'",
    "rich>=15.0.0",
    "redis>=8.1.0",
]

[tool.uv.sources]
torch = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.10.0,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
