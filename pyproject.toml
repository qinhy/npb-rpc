[project]
name = "npb-rpc"
version = "0.1.0"
description = "Typed RPC for Pydantic and NumPy payloads using the NPB codec"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NPB contributors" },
]
keywords = [
    "ipc",
    "nng",
    "rpc",
    "numpy",
    "pydantic",
    "zeromq",
    "zero-copy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "dai>=0.3.75",
    "depthai_camera_stream@git+https://github.com/qinhy/depthai-camera-stream",
    "npb@git+https://github.com/qinhy/npb",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
nng = [
    "pynng>=0.9,<1",
]
zmq = [
    "pyzmq>=27.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "opencv-python>=5.0.0.93",
    "pynng>=0.9,<1",
    "pytest>=8",
    "pyzmq>=27.0",
    "ruff>=0.8",
    "ultralytics>=8.4.150",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
